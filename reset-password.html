<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Coaching Portal — Set New Password</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#003366">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coach Portal">
  <link rel="apple-touch-icon" href="icon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.1/dist/umd/supabase.min.js"
    integrity="sha384-sfbOag7cEcqn2DK53T/iBNAH/2cMCf7bSzJDwBhV117A0z/NIj9Usei1jKIBY1Ae"
    crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Aptos', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #003366 0%, #0D9488 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; color: #333;
    }
    .login-box {
      background: white; border-radius: 12px; padding: 32px 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 380px;
    }
    .login-logo { text-align: center; margin-bottom: 20px; }
    .login-logo img { height: 48px; margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto; }
    .login-logo h1 { font-size: 22px; font-weight: 700; color: #003366; letter-spacing: -0.5px; }
    .login-title { font-size: 16px; font-weight: 700; color: #003366; margin-bottom: 6px; text-align: center; }
    .login-sub { font-size: 13px; color: #999; margin-bottom: 24px; line-height: 1.5; text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
    .password-wrapper { position: relative; }
    .form-group input {
      width: 100%; padding: 10px 12px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 16px; font-family: inherit; transition: border-color 0.2s;
    }
    .form-group input:focus { outline: none; border-color: #0D9488; }
    .toggle-password {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #999;
      font-size: 13px; padding: 4px; font-family: inherit;
    }
    .toggle-password:hover { color: #0D9488; }
    .btn-primary {
      background: #003366; color: white; padding: 12px 20px; border: none;
      border-radius: 6px; font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer; width: 100%; transition: background 0.2s; margin-top: 4px;
    }
    .btn-primary:hover { background: #002244; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg { font-size: 13px; margin-top: 12px; padding: 10px 14px; border-radius: 6px; line-height: 1.5; }
    .msg.error { color: #721c24; background: #f8d7da; }
    .msg.success { color: #155724; background: #d4edda; }
    .back-link {
      display: block; text-align: center; margin-top: 14px; font-size: 13px;
      color: #0D9488; text-decoration: none; font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
    .login-contact {
      margin-top: 20px; font-size: 9pt; color: rgba(255,255,255,0.75);
      text-align: center; line-height: 1.6;
    }
    .login-contact a { color: rgba(255,255,255,0.75); text-decoration: none; }
    .login-contact a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">
      <img src="Assets/C4U.png" alt="Coach4U">
      <h1>Your Coaching Portal</h1>
    </div>
    <p class="login-title">Set a new password</p>
    <p class="login-sub">Choose a password that's at least 8 characters.</p>
    <form id="resetForm" onsubmit="handleReset(event)">
      <div class="form-group">
        <label>New password</label>
        <div class="password-wrapper">
          <input type="password" id="password" required minlength="8" autocomplete="new-password">
          <button type="button" class="toggle-password" id="togglePw">Show</button>
        </div>
      </div>
      <div class="msg" id="resetMsg" style="display:none"></div>
      <button type="submit" class="btn-primary" id="resetBtn">Update Password</button>
    </form>
    <a class="back-link" href="index.html">&#8592; Back to sign in</a>
  </div>

  <p class="login-contact">
    Strengths-Based Coaching and Counselling<br>
    <a href="http://www.coach4u.com.au">www.coach4u.com.au</a> &nbsp;|&nbsp;
    <a href="mailto:cath@coach4u.com.au">cath@coach4u.com.au</a> &nbsp;|&nbsp;
    0402 313 337
  </p>

  <script>
    const SUPABASE_URL  = 'https://eekefsuaefgpqmjdyniy.supabase.co'
    const SUPABASE_ANON = 'sb_publishable_pcXHwQVMpvEojb4K3afEMw_RMvgZM-Y'
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON)

    const pwInput  = document.getElementById('password')
    const toggleBtn = document.getElementById('togglePw')

    toggleBtn.addEventListener('click', () => {
      if (pwInput.type === 'password') { pwInput.type = 'text'; toggleBtn.textContent = 'Hide' }
      else { pwInput.type = 'password'; toggleBtn.textContent = 'Show' }
    })

    async function handleReset(event) {
      event.preventDefault()
      const btn   = document.getElementById('resetBtn')
      const msgEl = document.getElementById('resetMsg')
      btn.disabled = true
      btn.textContent = 'Updating…'
      msgEl.style.display = 'none'
      msgEl.className = 'msg'

      const { error } = await sb.auth.updateUser({ password: pwInput.value })

      msgEl.style.display = 'block'
      if (error) {
        msgEl.classList.add('error')
        msgEl.textContent = error.message
        btn.disabled = false
        btn.textContent = 'Update Password'
      } else {
        msgEl.classList.add('success')
        msgEl.textContent = 'Password updated. Taking you to sign in…'
        setTimeout(() => window.location.href = 'index.html', 2000)
      }
    }
  </script>
</body>
</html>
